<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Door IPPT Calculator</title>
</head>
<body>
    <div class="container">
        <h1>Garage Door IPPT Calculator</h1>
        <form>
            <label for="doorWeight">Door Weight (lbs): </label>
            <input type="number" id="doorWeight" required><br><br>

            <label for="doorHeight">Door Height (ft): </label>
            <input type="number" id="doorHeight" required><br><br>

            <label for="turns">Turns: </label>
            <input type="number" id="turns" required><br><br>

            <label for="drumDiameter">Drum Diameter (in): </label>
            <input type="number" id="drumDiameter" required><br><br>

            <button type="button" id="calculateButton">Calculate</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
